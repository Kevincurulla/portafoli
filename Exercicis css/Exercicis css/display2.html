<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Maquetación de Cabecera y Menú</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #ffffff;
            border-bottom: 2px solid #e4e6eb;
            padding: 0 30px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 22pt;
        }

        .logo-text {
            font-size: 16pt;
            font-weight: bold;
            color: #1a1613;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 100%;
        }

        .nav-item {
            font-size: 11pt;
            font-weight: 600;
            color: #4b5563;
            text-decoration: none;
            padding: 0 16px;
            height: 70px;
            display: flex;
            align-items: center;
            transition: color 0.2s ease, background-color 0.2s ease;
        }

        .nav-item:hover {
            color: #2563eb;
            background-color: #f8fafc;
        }

        .nav-item.active {
            color: #2563eb;
            border-bottom: 3px solid #2563eb;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <span class="logo-icon">⚓</span>
            <span class="logo-text">MelvilleProject</span>
        </div>

        <nav class="nav-menu">
            <a href="#" class="nav-item active">Inicio</a>
            <a href="#" class="nav-item">Libros</a>
            <a href="#" class="nav-item">Análisis</a>
            <a href="#" class="nav-item">Contacto</a>
        </nav>
    </header>

</body>
</html>
