<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ficha de Producto - Lavadora Dual</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #fcfbfa;
            color: #2b2621;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 25px;
            background-color: #ffffff;
            border: 1px solid #e6e1da;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .product-title {
            font-size: 22pt;
            font-weight: bold;
            color: #1a1613;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .product-subtitle {
            font-size: 14pt;
            font-weight: normal;
            color: #5c534c;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .image-placeholder {
            width: 100%;
            height: 250px;
            background-color: #f0ede6;
            border: 2px dashed #b5a897;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7c7267;
            font-style: italic;
            font-size: 11pt;
            margin-bottom: 25px;
        }

        .product-details {
            font-family: monospace;
            font-size: 11.5pt;
            color: #3d352e;
            background-color: #fcfbfa;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #b5a897;
            margin-bottom: 20px;
        }

        .product-details div {
            margin-bottom: 6px;
        }

        .product-details div:last-child {
            margin-bottom: 0;
        }

        .product-price {
            font-size: 20pt;
            font-weight: bold;
            color: #bd0000;
            text-align: right;
            border-top: 1px solid #e6e1da;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="product-title">Lavadora Dual</h1>
        <p class="product-subtitle">Agitador y apertura superior</p>
        
        <div class="image-placeholder">
            (Una imagen)
        </div>
        
        <div class="product-details">
            <div><strong>Model:</strong> NTW4516FW</div>
            <div><strong>SKU:</strong> 5369600</div>
        </div>
        
        <div class="product-price">
            494,99 euros
        </div>
    </div>

</body>
</html>
