<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrapa al Monstruo - Borde Degradado</title>
    <style>
        body {
            background-color: #2b1d16;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tarjeta-blanca {
            background-color: #ffffff;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-monstruo {
            border: 15px solid;
            border-image: linear-gradient(to bottom, #00ffff, #ff0000) 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .contenedor-monstruo img {
            width: 100%;
            max-width: 400px;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="tarjeta-blanca">
        <div class="contenedor-monstruo">
            <img src="https://andros.dev/static/img/courses/css/activities/10-monstruo.png" alt="Monstruo de tres ojos">
        </div>
    </div>

</body>
</html>
