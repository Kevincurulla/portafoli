<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro en la Red Social</title>
</head>
<body>

    <h1>Crea tu cuenta</h1>

    <form action="#" method="POST">
        
        <!-- Nombre completo -->
        <div>
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <br>

        <!-- Nombre de usuario (@usuario) -->
        <div>
            <label for="username">Nombre de usuario:</label>
            <input type="text" id="username" name="username" placeholder="ej. juan_perez" required>
        </div>
        <br>

        <!-- Correo electrónico -->
        <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <!-- Contraseña -->
        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" minlength="8" required>
        </div>
        <br>

        <!-- Fecha de nacimiento (para validar edad) -->
        <div>
            <label for="nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="nacimiento" name="nacimiento" required>
        </div>
        <br>

        <!-- Aceptación de términos y condiciones -->
        <div>
            <label>
                <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
                Acepto los términos y condiciones de la red social.
            </label>
        </div>
        <br>

        <!-- Botón de registro -->
        <button type="submit">Registrarse</button>

    </form>

</body>
</html>
