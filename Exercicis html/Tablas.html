<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Películas Disney</title>
    <style>
        /* Unos pequeños estilos opcionales para quitar los bordes 
           y centrar el contenido verticalmente como en la imagen */
        table {
            border-collapse: collapse;
            font-family: serif;
        }
        th, td {
            padding: 15px;
            text-align: left;
            vertical-align: middle;
            font-size: 22px;
        }
        th {
            font-size: 26px;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Portada</th>
                <th>Título</th>
                <th>Año</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <td>
                    <img src="https://i.ebayimg.com/images/g/rc8AAOSwyoRk8fH0/s-l1200.jpg" alt="Mulan" width="180">
                </td>
                <td>Mulan</td>
                <td>1998</td>
            </tr>
            
            <tr>
                <td>
                    <img src="https://m.media-amazon.com/images/M/MV5BNjExYTQwY2EtMDRkYi00ZWIzLTkwZDUtYjVmODYxMDUwNDI5XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="El rey león" width="180">
                </td>
                <td colspan="2">El rey león 1994</td>
            </tr>
            
            <tr>
                <td>
                    <img src="https://m.media-amazon.com/images/I/71By1YRlADL._AC_UF894,1000_QL80_.jpg" alt="Aladdin" width="180">
                </td>
                <td>Aladdin</td>
                <td>1992</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
