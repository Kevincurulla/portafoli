<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Altavoces</title>
</head>
<body>

    <h1>Formulario de Venta de Altavoces</h1>

    <form action="#" method="POST">
        
        <div>
            <label for="modelo">Modelo de altavoz:</label>
            <select id="modelo" name="modelo" required>
                <option value="">-- Selecciona un modelo --</option>
                <option value="R4">R4</option>
                <option value="R5">R5</option>
                <option value="SR1">SR1</option>
            </select>
        </div>
        <br>

        <div>
            <label for="potencia">Potencia máxima (W):</label>
            <input type="number" id="potencia" name="potencia" min="50" max="100" placeholder="Entre 50 y 100" required>
        </div>
        <br>

        <div>
            <label>
                <input type="checkbox" id="bluetooth" name="bluetooth" value="si">
                ¿Incluye Bluetooth?
            </label>
        </div>
        <br>

        <div>
            <label for="color">Color del altavoz:</label>
            <input type="color" id="color" name="color" value="#000000">
        </div>
        <br>

        <button type="submit">Enviar especificaciones</button>

    </form>

</body>
</html>
